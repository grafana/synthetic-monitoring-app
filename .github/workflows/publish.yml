# Manual deployment workflow for Synthetic Monitoring App
# Uses shared workflows from plugin-ci-workflows for provisioned plugins
# Documentation: https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/010-plugins-ci-github-actions

name: Manual Deployment
run-name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to publish from.
        default: main
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options:
          - 'dev'
          - 'ops'
          - 'prod'

permissions: {}

jobs:
  # GitHub expressions cannot regex-match, and startsWith(branch, 'v') would
  # also match feature branches like "validate-x". Do an exact match instead:
  # only `main` and vX.Y.Z release tags count as release refs. Keep this
  # pattern in sync with the `release-reference-regex` input below.
  check-ref:
    name: Check ref type
    runs-on: ubuntu-latest
    outputs:
      is-release-ref: ${{ steps.check.outputs.is-release-ref }}
    env:
      REF: ${{ github.event.inputs.branch }}
    steps:
      - id: check
        run: |
          if [[ "$REF" =~ ^(main|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "is-release-ref=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release-ref=false" >> "$GITHUB_OUTPUT"
          fi

  cd:
    name: CD
    needs: check-ref
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v11.1.0
    #  About permissions below.
    #
    # - attestations: write: publish attestations.
    # - contents: write: checkout code (read); create a git tag (write, not
    #   used); create a GitHub Release (write, not used); publish techdocs to
    #   webiste (not used). Change to contents: read as soon as possible.
    # - id-token: write: used to mint various tokens.
    # - pull-requests: read: list PRs to determine if the branch from which the
    #   release is created is an open PR. We don't need this because we set
    #   branch=main. Remove this as soon as possible.
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    with:
      branch: ${{ github.event.inputs.branch }}

      # Treat release tags (vX.Y.Z) like main: publish the clean version from plugin.json
      # without the "+<commit SHA>" suffix. Everything else (PR branches) still gets the
      # suffix, keeping dev preview deploys unique. Dev auto-deploys are unaffected: they
      # run via validate_main.yml, which sets plugin-version-suffix explicitly.
      # Anchored (^...$) because cd.yml substring-matches with RegExp.test(); must stay
      # in sync with the check-ref job above so trigger-argo and versioning agree.
      release-reference-regex: ^(main|v\d+\.\d+\.\d+)$

      environment: ${{ github.event.inputs.environment }}

      docs-only: false

      scopes: universal

      # Argo CD inputs
      grafana-cloud-deployment-type: provisioned
      # Trigger the Grafana Cloud rollout for main, release tags, and any deploy to
      # dev. Without this, a deploy publishes to the catalog but never reaches
      # instances
      trigger-argo: ${{ needs.check-ref.outputs.is-release-ref == 'true' || github.event.inputs.environment == 'dev' }}
      argo-workflow-slack-channel: '#sm-ops-deploys'

      auto-merge-environments: dev,ops,prod-canary,prod

      # Auto-approve every stage in Argo so the deployment progresses from
      # canary through to prod without a manual "Resume" click.
      # "0" = approve immediately; swap for a duration (e.g. "2h") to keep a soak.
      auto-approve-durations: |-
        {"dev": 0, "ops": 0, "prod-canary": 0, "prod": 0}

      # https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/010-plugins-ci-github-actions/#customizing-the-workflows-with-inputs
      node-version: 22
      run-playwright: false  # Disabled - no Playwright tests configured
